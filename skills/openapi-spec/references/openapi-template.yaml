# Schema directive: a yaml-language-server modeline. Editors (Red Hat YAML
# language server, VS Code, IntelliJ) and the bundled validator
# (validate-openapi.mjs) read the SAME line, so there is one source of truth.
# In a modeline `$schema` is the schema to validate against; here the frozen,
# date-stamped OpenAPI 3.2 meta-schema. The spec body starts at `openapi:`.
# yaml-language-server: $schema=https://spec.openapis.org/oas/3.2/schema/2025-11-23

openapi: 3.2.0

info:
  title: '<service name>'
  version: '0.1.0'
  description: |
    One or two sentences on what this API is for and who calls it.
    Replace the `<...>` placeholders; component keys must match ^[a-zA-Z0-9._-]+$.
  contact:
    name: '<team>'
    url: 'https://example.com/support'
  license:
    name: '<license>'

servers:
  - url: 'http://localhost:<port>/<basePath>'
    description: Local development
  - url: 'https://<api-host>'
    description: Production

tags:
  - name: examples
    description: Example resource operations

security:
  - bearerAuth: []

paths:
  /examples:
    get:
      operationId: listExamples
      summary: List examples
      tags: [examples]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from the previous response.
          schema:
            type: string
      responses:
        '200':
          description: A page of examples.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamplePage'
              examples:
                default:
                  value:
                    data:
                      - id: '4a7e0f12-3b1c-4d2a-9f88-0c1b2d3e4f50'
                        name: 'widget'
                    next_cursor: 'eyJwYWdlIjoyfQ'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createExample
      summary: Create an example
      tags: [examples]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExampleCreate'
            examples:
              default:
                value:
                  name: 'widget'
      responses:
        '201':
          description: The created example.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  '/examples/{id}':
    get:
      operationId: getExample
      summary: Fetch a single example
      tags: [examples]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested example.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Bearer token (JWT).'

  responses:
    BadRequest:
      description: Malformed or invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The referenced resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with existing state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: 'invalid_argument'
        message:
          type: string
          description: Human-readable explanation.
          example: 'limit must be between 1 and 100'

    Example:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          example: '4a7e0f12-3b1c-4d2a-9f88-0c1b2d3e4f50'
        name:
          type: string
          example: 'widget'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
          example: '2026-07-30T12:00:00Z'

    ExampleCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: 'widget'

    ExamplePage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Example'
        next_cursor:
          type:
            - string
            - 'null'
          description: Opaque cursor for the next page; absent on the last page.
