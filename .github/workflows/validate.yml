name: validate

# Runs the repository's deterministic gates on every push and pull request.
# This repository ships docs and skills only; scripts/check.py is the single
# verification surface for artifacts, so CI runs it on a clean runner so a
# broken artifact never lands on main or develop. The measurement harness
# under evals/ is code, so it carries a check of its own.
#
# Gates: `python3 scripts/check.py --all` runs all thirty-five. The
# authoritative list is `python3 scripts/check.py --help`; the summary below is
# a reading aid, not the registry, so a gate added there without a line here
# still runs. The file that enforces a gate is scripts/check.py.
#   budget       AGENTS.md line budget (the concision charter)
#   cost         the always-on footprint stays within its token budget
#   frontmatter  valid, colon-safe Agent-Skills metadata on every skill/command
#   layout       every skill directory holds SKILL.md; references one level deep
#   thirdparty   a symlinked skill is an untracked, documented pointer
#   descriptions every description carries a trigger clause and a boundary
#   skillvoice   every skill description instructs and names its scope
#   skillbudget  every skill body stays loadable whole
#   references   every bundled reference names its load condition
#   links        every relative Markdown link resolves
#   agnostic     core doctrine free of host-binding tokens
#   portable     core doctrine free of language, framework, stack-specific tokens
#   shared       the shared-meaning rule survives on every surface that carries it
#   goal         the goal-object rule survives on the doctrine and the delivery skill
#   manifests    marketplace manifests parse; version fields agree
#   privacy      doctrine free of real-work identifiers
#   comments     the comment rule survives on both canonical surfaces
#   simplicity   the simplicity rule survives on both canonical surfaces
#   dashes       the em-dash convention survives on both canonical surfaces,
#                and the doctrine corpus carries no en-dash (digit-to-digit
#                ranges are exempt as typographic data)
#   l1           the owed L1: done-report line survives on both surfaces
#   veriloop     the verification loop survives on both canonical surfaces
#   memory       the memory rule survives on both canonical surfaces
#   searchdiscipline the search-discipline rule survives on both doctrine
#                surfaces and on the skill that owns the search engines
#   environment  the execution-environment clause survives on both surfaces
#   automation   the automation-layer clause survives on both surfaces
#   state        the runtime-state rule survives on both doctrines and execution
#   branch       the task-branch rule survives on every surface that can reach
#                a git repository
#   sizing       the three cost-sizing rules survive on every carrying surface
#   bottleneck    the framing the loop rests on (code stopped being the
#                bottleneck; the old control objectives stay while the
#                enforcement changes) survives on every surface carrying it
#   stages       the six-stage spine and each stage's artifact survive on both
#                doctrines and the delivery skill
#   playbook     the playbook's mechanics (accepted artifact fires the next
#                gate, one source of truth per artifact, advisory versus
#                deterministic controls, autonomy stopping at the gate)
#                survive on every surface that carries them
#   modernize    every modernize-coding adapter is present and version-pinned;
#                Go and Java claims are cross-checked against GOROOT/api and
#                the JDK's own src.zip @since tags
#   evals        the harness regression suite exists and is well-formed
#   triggers     the description-trigger set is present and large enough to
#                measure a description
#   standalone   every hard constraint is present in the standalone copy too

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    name: validate artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run check.py (deterministic gates)
        run: python3 scripts/check.py --all

      - name: Run the measurement-harness check (parallel measure)
        run: python3 evals/test_run_triggers.py
