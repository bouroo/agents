name: validate

# Runs the repository's deterministic gates on every push and pull request.
# This repository ships docs and skills only; scripts/check.py is the single
# verification surface, so CI runs it on a clean runner so a broken artifact
# never lands on main or develop.
#
# Gates (`python3 scripts/check.py --help` for the authoritative list):
#   budget       AGENTS.md line budget (the concision charter)
#   frontmatter  valid, colon-safe Agent-Skills metadata on every skill
#   links        every relative Markdown link resolves
#   agnostic     core doctrine free of host-binding tokens

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    name: validate artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run check.py (deterministic gates)
        run: python3 scripts/check.py --all
